[project]
name = "demandcast"
version = "1.0.0"
description = "Demand forecasting and prep planning for a synthetic four-site restaurant group: 15-minute history, gradient boosting with hierarchical reconciliation, rolling backtests, newsvendor prep, supplier orders, and staffing."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
demandcast = "demandcast.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demandcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
